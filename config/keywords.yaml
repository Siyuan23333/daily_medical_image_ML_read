# Cheap regex prefilter (case-insensitive). Journal-list and PubMed-topic papers skip the prefilter.
# arXiv:   needs >=1 strong medical term, or >=2 distinct weak ones (or primary category eess.IV/q-bio with any)
# medRxiv: needs >=1 ml term, or a bone_imaging term
# bioRxiv: needs >=1 ml term AND >=1 medical term, or a bone_imaging term
# strong medical terms: one is enough for an arXiv paper to pass
medical:
  - "\\bmedical\\b"
  - "\\bclinical\\b"
  - "\\bpatient"
  - "\\bradiolog"
  - "\\bradiomic"
  - "\\bCT\\b"
  - "\\bMRI?\\b"
  - "magnetic resonance"
  - "computed tomograph"
  - "\\bx-?ray"
  - "radiograph"
  - "ultraso"
  - "mammogra"
  - "\\bPET\\b"
  - "\\bSPECT\\b"
  - "\\bDXA\\b"
  - "histopatholog"
  - "pathology"
  - "whole[- ]slide"
  - "\\bbone\\b"
  - "osteopor"
  - "fracture"
  - "skeletal"
  - "osteoarthritis"
  - "vertebra"
  - "orthop(a)?edic"
  - "electronic health record"
  - "\\bEHR\\b"
  - "\\bICU\\b"
  - "\\bbiomedical\\b"
  - "\\bsegmentation\\b.*\\b(organ|lesion|tumou?r|vessel|brain|lung|liver|kidney|prostate|cardiac|heart|knee|hip|spine)"
  - "\\b(brain|lung|liver|kidney|prostate|breast|cardiac|heart|retina|fundus|dermatolog|skin lesion|knee|hip|spine)\\b"
# weak medical terms: an arXiv paper needs two distinct ones (or one strong term)
medical_weak:
  - "\\bdiagnos"
  - "\\bprognos"
  - "hospital"
  - "\\bsurviv"
  - "disease"
  - "\\bhealth(care)?\\b"
  - "\\btumou?r"
  - "\\bcancer"
  - "\\blesion"
ml:
  - "machine learning"
  - "deep learning"
  - "neural network"
  - "\\bCNN\\b"
  - "convolutional"
  - "transformer"
  - "foundation model"
  - "vision[- ]language"
  - "large language model"
  - "\\bLLM"
  - "self-supervised"
  - "contrastive"
  - "diffusion model"
  - "generative"
  - "artificial intelligence"
  - "\\bAI\\b"
  - "radiomic"
  - "\\bclassif"
  - "\\bsegmentation"
  - "predictive model"
  - "prediction model"
  - "random forest"
  - "gradient boost"
  - "\\bXGBoost\\b"
  - "support vector"
  - "federated"
  - "reinforcement learning"
  - "natural language processing"
  - "\\bNLP\\b"
# bone densitometry / microarchitecture imaging: lets HR-pQCT and DXA preprints through without an ML term
bone_imaging:
  - "\\bHR-?pQCT\\b"
  - "\\bpQCT\\b"
  - "peripheral quantitative computed tomograph"
  - "\\bDE?XA\\b"
  - "absorptiometry"
  - "bone densitometry"
  - "trabecular bone score"
exclude_title:
  - "^(erratum|correction|corrigendum|retraction|editorial|comment on|reply to|author correction|publisher correction)"
  - "\\bin this issue\\b"
